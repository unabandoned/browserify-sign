schema: 1

package: "@unabandoned/browserify-sign"

upstream:
  repo: browserify/browserify-sign
  reason: >-
    still released, but the signing tree beneath it is not - create-hash and
    create-hmac have had no release since 2018

  # Upstream commits looked at and deliberately not pulled, so the drift report
  # stops re-reporting them and a genuinely new commit stands out.
  reviewed:
    - sha: 97daf6e9
      decision: declined
      note: >-
        sets cache-mode in upstream's require-allow-edits.yml, a workflow this
        fork does not have; our CI is the shared reusable workflows
    - sha: 71d9ffa9
      decision: declined
      note: >-
        bumps @ljharb/eslint-config and auto-changelog, dev tooling this fork
        does not carry; Renovate manages ours

summary: >-
  Node's crypto Sign/Verify streams implemented for the browser: RSA and ECDSA
  signature creation and verification over the algorithms in Node's crypto API.

why-forked: >-
  @unabandoned/crypto-browserify depends on it, and it was the one node in that
  chain the org had forked but never onboarded - sitting on the upstream package
  name with upstream's own workflows. Adopted so the chain is owned end to end,
  and so its readable-stream dependency could move from 2.3.8 to the fork's 4.x.

status: active

used-by:
  - consumer: "@unabandoned/crypto-browserify"
    purpose: "Provides the Sign/Verify implementation behind crypto.createSign / createVerify."

tags: [crypto, signing, rsa, ecdsa, browser, browserify]
